<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UporBlock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      min-height: 240px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: #059669;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
      color: white;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #059669;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-incomplete {
      background: #f3f4f6;
      color: #6b7280;
    }

    .status-warning {
      background: #fef3c7;
      color: #d97706;
    }

    .status-blocked {
      background: #fee2e2;
      color: #dc2626;
    }

    .status-completed {
      background: #d1fae5;
      color: #059669;
    }

    .info-section {
      margin-bottom: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .info-row:not(:last-child) {
      border-bottom: 1px solid #f3f4f6;
    }

    .info-label {
      font-size: 13px;
      color: #6b7280;
    }

    .info-value {
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .progress-section {
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-label {
      font-size: 12px;
      color: #6b7280;
    }

    .progress-value {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
    }

    .progress-bar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #059669;
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    .progress-fill.warning {
      background: #d97706;
    }

    .progress-fill.danger {
      background: #dc2626;
    }

    .session-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #f0fdf4;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #065f46;
    }

    .session-indicator.inactive {
      background: #f9fafb;
      color: #6b7280;
    }

    .session-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: blink 1.5s infinite;
    }

    .session-indicator.inactive .session-dot {
      background: #9ca3af;
      animation: none;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 12px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: #059669;
      color: white;
    }

    .btn-primary:hover {
      background: #047857;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #e5e7eb;
      color: #374151;
    }

    .btn-outline:hover {
      background: #f9fafb;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .pairing-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .error {
      padding: 10px 12px;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .footer-link {
      font-size: 11px;
      color: #9ca3af;
      text-decoration: none;
      cursor: pointer;
    }

    .footer-link:hover {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Not Paired State -->
    <div id="pairing-view" class="hidden">
      <div class="header">
        <div class="logo">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
          </div>
          <span class="logo-text">UporBlock</span>
        </div>
      </div>
      <div class="pairing-form">
        <p style="font-size: 13px; color: #6b7280;">
          Masukkan kode pairing dari web dashboard
        </p>
        <input
          type="text"
          id="pairing-code"
          class="input"
          placeholder="Masukkan kode"
          maxlength="6"
          style="text-transform: uppercase; letter-spacing: 3px; text-align: center; font-weight: 600;"
        >
        <button id="pair-btn" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
          </svg>
          Hubungkan
        </button>
        <div id="pairing-error" class="error hidden"></div>
      </div>
    </div>

    <!-- Paired State -->
    <div id="status-view" class="hidden">
      <div class="header">
        <div class="logo">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
          </div>
          <span class="logo-text">UporBlock</span>
        </div>
        <span id="status-badge" class="status-badge status-incomplete">Incomplete</span>
      </div>

      <div id="session-indicator" class="session-indicator inactive">
        <div class="session-dot"></div>
        <span id="session-text">Tidak ada sesi aktif</span>
      </div>

      <div class="info-section">
        <div class="info-row">
          <span class="info-label">Waktu Distraksi</span>
          <span id="distraction-time" class="info-value">0m 0s</span>
        </div>
        <div class="info-row">
          <span class="info-label">Threshold</span>
          <span id="threshold" class="info-value">30 menit</span>
        </div>
        <div class="info-row">
          <span class="info-label">Block Aktif</span>
          <span id="block-status" class="info-value">Tidak</span>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-header">
          <span class="progress-label">Progress</span>
          <span id="progress-percent" class="progress-value">0%</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="actions">
        <button id="sync-btn" class="btn btn-outline">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
          </svg>
          Sync
        </button>
        <button id="dashboard-btn" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
          Dashboard
        </button>
      </div>

      <div class="footer">
        <a id="logout-btn" class="footer-link">Logout & Hapus Token</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
